<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1><i><b>Expense Tracker</b></i></h1>

    <div class="card">

        <form id="expenseForm">

            <input
                type="text"
                id="title"
                placeholder="Expense Title"
                required>

            <input
                type="number"
                id="amount"
                placeholder="Amount"
                required>

            <select id="category">

                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Education">Education</option>

            </select>

            <input
                type="date"
                id="date"
                required>

            <button type="submit">
                Add Expense
            </button>

        </form>

    </div>

    <div class="total-box">

        <b><i>Total Spending</i></b>

        <h2>
            ₹ <span id="totalAmount">0</span>
        </h2>

    </div>

    <h2><b><i>Expense History</i></b></h2>

    <table>

        <thead>

        <tr>
            <th><b>Title</b></th>
            <th><b>Amount</b></th>
            <th><b>Category</b></th>
            <th><b>Date</b></th>
            <th><b>Action</b></th>
        </tr>

        </thead>

        <tbody id="expenseTable">

        </tbody>

    </table>

</div>

<script
src="{{ url_for('static', filename='script.js') }}">
</script>

</body>
</html>
